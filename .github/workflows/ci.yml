name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Lint modal shells (UI foundation)
        run: npm run lint:modals

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  rls-pgtap:
    name: RLS suite (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # D1/A5 — the RLS security suite exists at supabase/tests/ and, until this
      # job, ran nowhere. Four RLS-touching changes reached production (C0, C1,
      # C2, N2/N3/N4) verified by reasoning and targeted probes but never by the
      # suite written for exactly that purpose. That was the largest residual
      # risk in the forensic audit.
      #
      # It runs against a LOCAL Supabase built from supabase/migrations, so it
      # needs no production credential and this repository can stay public. It
      # also catches a bad migration before it reaches any environment, which a
      # check pointed at a live project cannot do.
      # PINNED, not `latest`. `latest` resolves through an unauthenticated
      # GitHub API call on every run, which rate-limits and fails the job for a
      # reason that has nothing to do with the code -- a blocking check that
      # goes red at random is one people learn to ignore. Pinning also stops the
      # CLI changing under this suite without a commit saying so. Bump
      # deliberately.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Starts Postgres and applies every migration in order. Slow (image
      # pulls), so it is its own job rather than a step on an existing one.
      - name: Start local Supabase
        run: supabase start

      # Hosted Supabase grants anon/authenticated table privileges on `public` at
      # project creation, outside this repo, so a local instance built purely
      # from supabase/migrations lacks them and the first SELECT as
      # `authenticated` fails on privileges before RLS is ever consulted. This
      # closes that gap so the suite tests the POLICIES rather than the absence
      # of a grant. See the file's header: it is the table-level twin of C0.
      - name: Apply hosted-equivalent baseline grants
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"             -v ON_ERROR_STOP=1             -f supabase/scripts/local_baseline_grants.sql

      # Each test file runs in a transaction that is rolled back, so the suite
      # seeds its own fixtures and leaves nothing behind.
      - name: Run pgTAP suite
        run: supabase test db

      # Cleanup only, and it must never be the reported failure: if the CLI
      # install itself failed, this step cannot run and its "command not found"
      # would otherwise bury the real error.
      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup

  # NOTE: there is deliberately no job here for `npm run check:function-grants`,
  # which fails if a client role can execute a non-allowlisted SECURITY DEFINER
  # function in `public`. Two reasons, in order of weight:
  #
  #  1. Wrong trigger. Migrations in this project are applied by hand, so the
  #     moment that check matters is when someone applies one, not when code is
  #     pushed. On push it would mostly re-verify an unchanged database, and
  #     would report green while a migration sat unapplied. It is part of the
  #     migration ritual instead: see the verification block in
  #     supabase/migrations/20270109120000.
  #  2. Credential. It needs SUPABASE_SECRET_KEY, which is full database access
  #     and bypasses RLS. This repository is public and currently holds no
  #     Actions secrets at all. Adding that key here to guard against a future
  #     exposure is a poor trade against C0, the exposure it descends from.
  #
  # The right home for it in CI is the local Supabase instance the rls-pgtap job
  # above now starts, which needs no production credential. It is NOT wired
  # there yet, and deliberately so: C0's root cause was that HOSTED Supabase
  # grants anon/authenticated EXECUTE via project-level default privileges. It
  # has not been established that a local instance reproduces those defaults, so
  # the allowlist of 13 may simply not hold locally. Verify that against a
  # running local instance before adding it, rather than assuming the two
  # environments agree -- assuming exactly that is what produced C0.

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_E2E_SMOKE == 'true' }}
    # Reports without blocking, while the suite's first CI failures are diagnosed. The specs
    # pass locally against both a dev server and a production build, and again with only the
    # env this workflow passes, so what remains is specific to the runner.
    #
    # Non-blocking rather than switched off, deliberately: these specs had drifted through six
    # separate mismatches with the product precisely because nothing ran them, and one of them
    # left a spec passing while testing nothing at all. A job that runs and reports cannot rot
    # that way; a job that is off can.
    #
    # REMOVE THIS once a run is green. A permanently non-blocking test job is only marginally
    # better than no job, because nobody reads it.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PAYMENT_TOKEN_SECRET: ${{ secrets.PAYMENT_TOKEN_SECRET }}
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000

      - name: Seed E2E fixture venue
        run: node scripts/seed-e2e-smoke-venue.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          E2E_VENUE_SLUG: ${{ secrets.E2E_VENUE_SLUG }}
          E2E_VENUE_NAME: ${{ secrets.E2E_VENUE_NAME }}
          E2E_SERVICE_NAME: ${{ secrets.E2E_SERVICE_NAME }}
          E2E_OPTIONS_SERVICE_NAME: ${{ secrets.E2E_OPTIONS_SERVICE_NAME }}
          E2E_STRIPE_CONNECTED_ACCOUNT_ID: ${{ secrets.E2E_STRIPE_CONNECTED_ACCOUNT_ID }}
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000

      - name: Run Playwright smoke
        run: npm run test:e2e
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_VENUE_SLUG: ${{ secrets.E2E_VENUE_SLUG }}
          E2E_VENUE_NAME: ${{ secrets.E2E_VENUE_NAME }}
          E2E_SERVICE_NAME: ${{ secrets.E2E_SERVICE_NAME }}
          E2E_OPTIONS_SERVICE_NAME: ${{ secrets.E2E_OPTIONS_SERVICE_NAME }}
          # Fixed slug printed by the seed script; set it as a repo variable so
          # the staff-first specs run rather than skip.
          E2E_STAFF_FIRST_VENUE_SLUG: ${{ vars.E2E_STAFF_FIRST_VENUE_SLUG }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PAYMENT_TOKEN_SECRET: ${{ secrets.PAYMENT_TOKEN_SECRET }}
          # The web server Playwright starts inherits this step's env, so anything the app
          # needs at runtime has to be listed here as well as in the build and seed steps.
          # Their absence showed up as "STRIPE_WEBHOOK_SECRET is not set" and
          # "E2E_STRIPE_CONNECTED_ACCOUNT_ID is not set" in the run log.
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          E2E_STRIPE_CONNECTED_ACCOUNT_ID: ${{ secrets.E2E_STRIPE_CONNECTED_ACCOUNT_ID }}
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          TWILIO_ACCOUNT_SID: ACplaceholder
          TWILIO_AUTH_TOKEN: placeholder
          TWILIO_PHONE_NUMBER: "+15555555555"
          SENDGRID_API_KEY: SG.placeholder
          SENDGRID_FROM_EMAIL: noreply@example.com
